[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uniluanda-platform"
version = "0.1.0"
description = "API for managing and publishing UniLuanda professional profiles"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.4,<3.0",
    "pymysql>=1.1,<2.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "Pillow>=10.0,<13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11,<1.0",
]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
